<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Test Google Sheet</title>
</head>
<body>

<button onclick="sendData()">
  Test gửi dữ liệu
</button>

<script>

async function sendData() {

  await fetch(
    "https://script.google.com/macros/s/AKfycbwA2PeFqvCtFsgk5VVsKmPaeYgjERzT1ZbTpZtPKtb_IbdAs6AvgvGbJVKg_E0DMEY/exec",
    {
      method: "POST",
      mode: "no-cors",
      body: JSON.stringify({
        hello: "world",
        time: new Date().toISOString()
      })
    }
  );

  alert("Đã gửi dữ liệu");

}

</script>

</body>
</html>
